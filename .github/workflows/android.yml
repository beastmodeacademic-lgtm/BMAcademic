name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install PNPM
      run: npm install -g pnpm

    - name: Install Dependencies
      run: pnpm install

    - name: Next.js Export (Static HTML)
      run: pnpm build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Capacitor CLI & Core
      run: pnpm add @capacitor/core @capacitor/cli @capacitor/android

    - name: Auto Detect Web Dir and Initialize
      run: |
        if [ -d "out" ]; then
          WEB_DIR="out"
        elif [ -d ".next" ]; then
          WEB_DIR=".next"
        elif [ -d "dist" ]; then
          WEB_DIR="dist"
        elif [ -d "build" ]; then
          WEB_DIR="build"
        else
          WEB_DIR="."
        fi
        echo "Detected web directory: $WEB_DIR"
        pnpm cap init "Mobil Uygulamam" "com.tasarimci.myapp" --web-dir=$WEB_DIR

    - name: Add Android Platform
      run: pnpm cap add android

    - name: Sync Code to Android
      run: pnpm cap sync

    - name: Build Android APK & AAB
      run: |
        cd android
        ./gradlew assembleRelease
        ./gradlew bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload AAB Artifact (For Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release-bundle.aab
