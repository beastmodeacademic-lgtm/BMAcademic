name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install PNPM
      run: npm install -g pnpm

    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Next.js Export (Ignore All Errors)
      run: |
        export NEXT_TELEMETRY_DISABLED=1
        export TSC_COMPILE_ON_ERROR=true
        export ESLINT_NO_DEV_ERRORS=true
        pnpm build
      continue-on-error: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Capacitor
      run: pnpm add @capacitor/core @capacitor/cli @capacitor/android

    - name: Force Initialize Capacitor
      run: |
        mkdir -p out
        echo '{"appId":"com.tasarimci.myapp","appName":"Mobil Uygulamam","webDir":"out"}' > capacitor.config.json
        pnpm cap sync || true

    - name: Add Android Platform
      run: pnpm cap add android || true

    - name: Sync Code to Android
      run: pnpm cap sync

    - name: Build Android APK & AAB
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
        ./gradlew bundleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/

    - name: Upload AAB Artifact (For Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/
